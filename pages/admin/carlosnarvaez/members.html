<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Miembros del Equipo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f8f9fa;
            color: #333;
        }

        #btnGet {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        #btnGet:hover {
            background-color: #0056b3;
        }

        .acciones-barra {
            margin-bottom: 25px;
        }

        #miembros-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        #miembros-lista button {
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: background 0.2s;
        }

        #miembros-lista button:first-of-type {
            background-color: #e2e6ea;
            color: #343a40;
            margin-right: 8px;
        }

        #miembros-lista button:first-of-type:hover {
            background-color: #dae0e5;
        }
    </style>
</head>
<body>

    <h2>Panel de Miembros - Carlos Narvaez</h2>

    <div class="acciones-barra">
        <button id="btnGet">Agregar Nuevo Miembro</button>
    </div>

    <hr>

    <h3>Lista de Miembros Registrados:</h3>
    
    <div id="miembros-lista"></div>

    <script src="members.js" type="module"></script>
</body>
</html>
