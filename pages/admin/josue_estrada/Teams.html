<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Teams Page</title>

<link
    rel="stylesheet"
    href="./Teams.css"
>


</head>

<body>


<header>

    <h1>Teams Page</h1>

    <p>Manage your teams here.</p>

</header>

<section id="create-team-section">

    <h2 id="form-title">
        Create New Team
    </h2>

    <form id="create-team-form">

        <div class="form-group">

            <label for="team-name">
                Team Name
            </label>

            <input
                type="text"
                id="team-name"
                name="teamName"
                placeholder="Enter team name"
                autocomplete="off"
                required
            >

        </div>

        <div class="form-group">

            <label for="team-description">
                Description
            </label>

            <textarea
                id="team-description"
                name="description"
                rows="4"
                placeholder="Enter team description"
            ></textarea>

        </div>

        <div class="form-actions">

            <button
                type="submit"
                id="create-team-btn"
            >
                Save Team
            </button>

            <button
                type="button"
                id="cancel-edit-btn"
                hidden
            >
                Cancel Edit
            </button>

        </div>

    </form>

</section>

<section id="message-container">

    <p
        id="success-message"
        hidden
        aria-live="polite"
    ></p>

    <p
        id="error-message"
        hidden
        aria-live="assertive"
    ></p>

    <p
        id="loading-message"
        hidden
        aria-live="polite"
    >
        Loading...
    </p>

</section>

<section id="teams-container">

    <h2>
        Teams List
    </h2>

    <table id="teams-table">

        <caption>
            Registered Teams
        </caption>

        <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Members</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="teams-table-body"></tbody>

    </table>

</section>

<script
    type="module"
    src="./Teams.js"
></script>


</body>

</html>
