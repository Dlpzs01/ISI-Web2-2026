<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Admin - Justin</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <h1>Panel de Control (Vehículos & Usuarios)</h1>
        
        <div class="tabs">
            <button id="tab-vehicles" class="tab-btn active" onclick="switchTab('vehicles')">CRUD Vehículos</button>
            <button id="tab-users" class="tab-btn" onclick="switchTab('users')">CRUD Usuarios</button>
        </div>

        <div id="section-vehicles" class="crud-section">
            <h2>Gestión de Vehículos</h2>
            <form id="form-vehicles">
                <input type="hidden" id="vehicle-id">
                <div class="form-group">
                    <label>Marca / Modelo:</label>
                    <input type="text" id="vehicle-model" required>
                </div>
                <div class="form-group">
                    <label>Año:</label>
                    <input type="number" id="vehicle-year" required>
                </div>
                <button type="submit" id="btn-submit-vehicle">Guardar Vehículo</button>
                <button type="button" id="btn-cancel-vehicle" class="hidden" onclick="resetVehicleForm()">Cancelar</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Modelo</th>
                        <th>Año</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="table-vehicles-body"></tbody>
            </table>
        </div>

        <div id="section-users" class="crud-section hidden">
            <h2>Gestión de Usuarios</h2>
            <form id="form-users">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="user-name" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="user-email" required>
                </div>
                <button type="submit" id="btn-submit-user">Guardar Usuario</button>
                <button type="button" id="btn-cancel-user" class="hidden" onclick="resetUserForm()">Cancelar</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="table-users-body"></tbody>
            </table>
        </div>
    </div>

    <script src="./admin.js"></script>
</body>
</html>
